<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Progress Inside a Horizontal Scroller</title>
    <style>
      body {
        margin: 0;
      }

      .spacer {
        height: 150vh;
      }

      /* A horizontal slider: only overflow-x is meant to scroll. */
      #h-scroller {
        overflow-x: scroll;
        display: flex;
        gap: 16px;
        width: 380px;
      }

      #h-scroller > div {
        flex: 0 0 200px;
        height: 200px;
        background: #4a90d9;
      }
    </style>
  </head>
  <body>
    <div class="spacer"></div>
    <div id="h-scroller" data-testid="h-scroller">
      <div id="h-scroller-subject" data-testid="h-scroller-subject"></div>
      <div></div>
      <div></div>
    </div>
    <div class="spacer"></div>

    <script type="module" src="./scroll-horizontal-scroller.ts"></script>
  </body>
</html>
