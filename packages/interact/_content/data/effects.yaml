fillGuidance:
  both: "use for scroll-driven (`viewProgress`), pointer-driven (`pointerMove`), and toggling effects (`hover`/`click` with `alternate`, `repeat`, or `state` type)."
  backwards: "use for entrance animations with `type: 'once'` when the element's own CSS already matches the final keyframe (applies the initial keyframe during any `delay`)."

triggerTypes:
  - once
  - repeat
  - alternate
  - state

stateActions:
  - toggle
  - add
  - remove
  - clear

easings:
  - linear
  - ease
  - ease-in
  - ease-out
  - ease-in-out
  - sineIn
  - sineOut
  - sineInOut
  - quadIn
  - quadOut
  - quadInOut
  - cubicIn
  - cubicOut
  - cubicInOut
  - quartIn
  - quartOut
  - quartInOut
  - quintIn
  - quintOut
  - quintInOut
  - expoIn
  - expoOut
  - expoInOut
  - circIn
  - circOut
  - circInOut
  - backIn
  - backOut
  - backInOut

transitionEasings:
