triggers:
  - name: hover
    a11yAlias: interest
    a11yNote: "Use `trigger: 'interest'` instead of `trigger: 'hover'` to also respond to keyboard focus."
    defaultTriggerType: alternate
    params: []
    pitfalls:
      - id: hit-area
    showMultipleEffectsNote: true
    templateFields:
      - triggerType
      - keyframeEffect
      - namedEffect
      - fill
      - duration
      - easing
      - delay
      - iterations
      - alternate
    triggerTypeDescriptions:
      alternate: 'plays forward on enter, reverses on leave. Default. Most common for hover.'
      repeat: 'restarts the animation from the beginning on each enter. On leave, jumps to the beginning and pauses.'
      once: 'plays once on the first enter and never again.'
      state: 'resumes on enter, pauses on leave. Useful for continuous loops (`iterations: Infinity`).'
    stateActionDescriptions:
      toggle: 'applies the style state on enter, removes on leave. Default.'
      add: 'applies the style state on enter. Leave does NOT remove it.'
      remove: 'removes a previously applied style state on enter. Use with provided `effectId` to map to a matching interaction with `add` and effect with same `effectId`.'
      clear: 'clears all previously applied style states on enter. Use to reset multiple stacked `''add''` style changes at once (e.g. a "reset" hover area that undoes several accumulated states).'
    variableOverrides:
      sourceKeySuffix: 'The element that listens for hover.'
      targetKeyDesc: "identifier matching the element's key on the element that animates. Use a different key from `[SOURCE_KEY]` when source and target must be separated (see hit-area shift above)."
      fillModeDesc: "usually `'both'`. Keeps the final state applied while hovering, and prevents garbage-collection of animation when finished."
      easingDesc: "CSS easing string (e.g. `'ease-out'`, `'ease-in-out'`, `'cubic-bezier(0.4, 0, 0.2, 1)'`), or named easing from `@wix/motion`."
      iterationsDesc: "optional. Number of iterations, or `Infinity` for continuous loops. Primarily useful with `triggerType: 'state'`."
      fillCritical: "Always include `fill: 'both'` for `triggerType: 'alternate'`, `'repeat'` — keeps the effect applied while hovering and prevents garbage-collection. For `triggerType: 'once'` use `fill: 'backwards'`."
      customEffectExamples: ''
      offsetEasingSuffix: ' CSS easing string, or named easing from `@wix/motion`.'
      alternateBoolSuffix: ''

  - name: click
    a11yAlias: activate
    a11yNote: "Use `trigger: 'activate'` instead of `trigger: 'click'` to also respond to keyboard activation (Enter / Space)."
    defaultTriggerType: alternate
    params: []
    pitfalls: []
    showMultipleEffectsNote: false
    templateFields:
      - triggerType
      - keyframeEffect
      - namedEffect
      - fill
      - reversed
      - duration
      - easing
      - delay
      - iterations
      - alternate
      - effectId
    triggerTypeDescriptions:
      alternate: 'plays forward on first click, reverses on next click. Default.'
      repeat: 'restarts the animation from the beginning on each click.'
      once: 'plays once on the first click and never again.'
      state: 'resumes/pauses the animation on each click. Useful for continuous loops (`iterations: Infinity`).'
    stateActionDescriptions:
      toggle: 'applies the style state, removes it on next click. Default.'
      add: 'applies the style state. Does not remove on subsequent clicks.'
      remove: 'removes a previously applied style state.'
      clear: 'clears all previously applied style states. Useful for resetting multiple stacked style states at once.'
    variableOverrides:
      sourceKeySuffix: 'The element that listens for clicks.'
      targetKeyDesc: "identifier matching the element's key on the element that animates. If missing it defaults to `[SOURCE_KEY]` for targeting the source element."
      fillModeDesc: "optional. Always `'both'` with `triggerType: 'alternate'` or `'repeat'`, otherwise depends on the effect."
      easingDesc: 'CSS easing string, or named easing from `@wix/motion`.'
      iterationsDesc: 'optional. Number of iterations, or `Infinity` for continuous loops.'
      fillCritical: "Always include `fill: 'both'` for `triggerType: 'alternate'` or `'repeat'` — keeps the effect applied while finished and prevents garbage-collection, allowing efficient toggling. For `triggerType: 'once'` use `fill: 'backwards'`."
      customEffectExamples: ', randomized behavior'
      offsetEasingSuffix: ''
      alternateBoolSuffix: " Different from `triggerType: 'alternate'` which alternates per click."

  - name: viewEnter
    defaultTriggerType: once
    params:
      - name: threshold
        type: number
        optional: true
        description: 'Number between 0–1 indicating how much of the source element must be visible to trigger (e.g. `0.3` = 30%).'
      - name: inset
        type: string
        optional: true
        description: "String adjusting the viewport detection area (e.g. `'-100px'` extends it, `'50px'` shrinks it)."
    pitfalls:
      - id: same-element-viewenter
    showMultipleEffectsNote: true

  - name: viewProgress
    defaultTriggerType: null
    params: []
    pitfalls:
      - id: overflow-clip
    showMultipleEffectsNote: true

  - name: pointerMove
    defaultTriggerType: null
    params:
      - name: hitArea
        type: "'root' | 'self'"
        optional: true
        description: 'determines where mouse movement is tracked'
      - name: axis
        type: "'x' | 'y'"
        optional: true
        description: 'restricts pointer tracking to a single axis'
    pitfalls:
      - id: hit-area

  - name: animationEnd
    defaultTriggerType: null
    params:
      - name: effectId
        type: string
        optional: false
        description: 'ID of the preceding effect'

  - name: pageVisible
    defaultTriggerType: null
    params: []
    pitfalls: []
