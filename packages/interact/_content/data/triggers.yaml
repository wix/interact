triggers:
  - name: hover
    a11yAlias: interest
    a11yNote: "Use `trigger: 'interest'` instead of `trigger: 'hover'` to also respond to keyboard focus."
    category: event
    supportsTimeEffect: true
    supportsStateEffect: true
    supportsScrubEffect: false
    supportsCustomEffect: true
    defaultTriggerType: alternate
    params: []
    pitfalls:
      - id: hit-area
    showMultipleEffectsNote: true
    templateFields:
      timeEffect:
        - triggerType
        - keyframeEffect
        - namedEffect
        - fill
        - duration
        - easing
        - delay
        - iterations
        - alternate
      stateEffect:
        - stateAction
        - transition
        - transitionProperties
      customEffect:
        - triggerType
        - customEffect
        - duration
        - easing
    triggerTypeDescriptions:
      alternate: "plays forward on enter, reverses on leave. Default. Most common for hover."
      repeat: "restarts the animation from the beginning on each enter. On leave, jumps to the beginning and pauses."
      once: "plays once on the first enter and never again."
      state: "resumes on enter, pauses on leave. Useful for continuous loops (`iterations: Infinity`)."
    stateActionDescriptions:
      toggle: "applies the style state on enter, removes on leave. Default."
      add: "applies the style state on enter. Leave does NOT remove it."
      remove: "removes a previously applied style state on enter. Use with provided `effectId` to map to a matching interaction with `add` and effect with same `effectId`."
      clear: "clears all previously applied style states on enter. Use to reset multiple stacked `'add'` style changes at once (e.g. a \"reset\" hover area that undoes several accumulated states)."
    fillNote: "while hovering"

  - name: click
    a11yAlias: activate
    a11yNote: "Use `trigger: 'activate'` instead of `trigger: 'click'` to also respond to keyboard activation (Enter / Space)."
    category: event
    supportsTimeEffect: true
    supportsStateEffect: true
    supportsScrubEffect: false
    supportsCustomEffect: true
    defaultTriggerType: alternate
    params: []
    pitfalls: []
    showMultipleEffectsNote: false
    templateFields:
      timeEffect:
        - triggerType
        - keyframeEffect
        - namedEffect
        - fill
        - reversed
        - duration
        - easing
        - delay
        - iterations
        - alternate
        - effectId
      stateEffect:
        - stateAction
        - transition
        - transitionProperties
      customEffect:
        - triggerType
        - customEffect
        - duration
        - easing
    triggerTypeDescriptions:
      alternate: "plays forward on first click, reverses on next click. Default."
      repeat: "restarts the animation from the beginning on each click."
      once: "plays once on the first click and never again."
      state: "resumes/pauses the animation on each click. Useful for continuous loops (`iterations: Infinity`)."
    stateActionDescriptions:
      toggle: "applies the style state, removes it on next click. Default."
      add: "applies the style state. Does not remove on subsequent clicks."
      remove: "removes a previously applied style state."
      clear: "clears all previously applied style states. Useful for resetting multiple stacked style states at once."
    fillNote: "while finished"

  - name: viewEnter
    category: viewport
    supportsTimeEffect: true
    supportsStateEffect: false
    supportsScrubEffect: false
    supportsCustomEffect: true
    defaultTriggerType: once
    params:
      - name: threshold
        type: number
        optional: true
        description: "Number between 0–1 indicating how much of the source element must be visible to trigger (e.g. `0.3` = 30%)."
      - name: inset
        type: string
        optional: true
        description: "String adjusting the viewport detection area (e.g. `'-100px'` extends it, `'50px'` shrinks it)."
    pitfalls:
      - id: same-element-viewenter
    showMultipleEffectsNote: true

  - name: viewProgress
    category: scroll
    supportsTimeEffect: false
    supportsStateEffect: false
    supportsScrubEffect: true
    supportsCustomEffect: true
    defaultTriggerType: null
    params: []
    pitfalls:
      - id: overflow-clip
    showMultipleEffectsNote: true

  - name: pointerMove
    category: pointer
    supportsTimeEffect: false
    supportsStateEffect: false
    supportsScrubEffect: true
    supportsCustomEffect: true
    defaultTriggerType: null
    params:
      - name: hitArea
        type: "'root' | 'self'"
        optional: true
        description: "determines where mouse movement is tracked"
      - name: axis
        type: "'x' | 'y'"
        optional: true
        description: "restricts pointer tracking to a single axis"
    pitfalls:
      - id: hit-area

  - name: animationEnd
    category: chain
    supportsTimeEffect: true
    supportsStateEffect: false
    supportsScrubEffect: false
    supportsCustomEffect: false
    defaultTriggerType: null
    params:
      - name: effectId
        type: string
        optional: false
        description: "ID of the preceding effect"

  - name: pageVisible
    category: event
    supportsTimeEffect: true
    supportsStateEffect: false
    supportsScrubEffect: false
    supportsCustomEffect: false
    defaultTriggerType: null
    params: []
    pitfalls: []

  - name: activate
    aliasOf: click
    category: event

  - name: interest
    aliasOf: hover
    category: event
