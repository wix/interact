<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Enter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    interact-element { display: block; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    .scene {
      width: 100%;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }
    .circle {
      width: 16rem;
      height: 16rem;
      background-color: transparent;
      border: 1px solid white;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      will-change: transform;
    }
    .fill-circle {
      width: 100%;
      height: 100%;
      background-color: transparent;
      border-radius: 50%;
      transform: scale(0);
      will-change: transform;
    }
  </style>
</head>
<body>
  <div class="scene">
    <interact-element data-interact-key="circle-top" data-interact-initial="true" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;">
      <div class="circle"><div class="fill-circle"></div></div>
    </interact-element>
    <interact-element data-interact-key="circle-right" data-interact-initial="true" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;">
      <div class="circle"><div class="fill-circle"></div></div>
    </interact-element>
    <interact-element data-interact-key="circle-bottom" data-interact-initial="true" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;">
      <div class="circle"><div class="fill-circle"></div></div>
    </interact-element>
    <interact-element data-interact-key="circle-left" data-interact-initial="true" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:40;">
      <div class="circle"><div class="fill-circle"></div></div>
    </interact-element>
  </div>

  <script type="module">
    import { Interact } from 'https://esm.sh/@wix/interact@2.1.4/web?bundle';

    const DIST = '200px';
    const OFFSET = '80px';
    const DUR = 900;
    const EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';

    Interact.create({
      interactions: [
        { key: 'circle-top', trigger: 'viewEnter', effects: [{ fill: 'both', duration: DUR, easing: EASE, delay: 0, keyframeEffect: { name: 'slideTop', keyframes: [{ opacity: 0, transform: `translate(-${DIST}, -${OFFSET})` }, { opacity: 1, transform: `translate(0, -${OFFSET})` }] } }] },
        { key: 'circle-right', trigger: 'viewEnter', effects: [{ fill: 'both', duration: DUR, easing: EASE, delay: 100, keyframeEffect: { name: 'slideRight', keyframes: [{ opacity: 0, transform: `translate(${OFFSET}, -${DIST})` }, { opacity: 1, transform: `translate(${OFFSET}, 0)` }] } }] },
        { key: 'circle-bottom', trigger: 'viewEnter', effects: [{ fill: 'both', duration: DUR, easing: EASE, delay: 200, keyframeEffect: { name: 'slideBottom', keyframes: [{ opacity: 0, transform: `translate(${DIST}, ${OFFSET})` }, { opacity: 1, transform: `translate(0, ${OFFSET})` }] } }] },
        { key: 'circle-left', trigger: 'viewEnter', effects: [{ fill: 'both', duration: DUR, easing: EASE, delay: 300, keyframeEffect: { name: 'slideLeft', keyframes: [{ opacity: 0, transform: `translate(-${OFFSET}, ${DIST})` }, { opacity: 1, transform: `translate(-${OFFSET}, 0)` }] } }] },
      ],
    });
  </script>
</body>
</html>
