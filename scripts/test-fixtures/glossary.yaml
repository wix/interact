meta:
  package: "@wix/test-pkg"
  version: "1.0.0"
  lastAudit: "2026-05-01"

terms:
  - id: trigger-viewEnter
    name: viewEnter
    category: trigger
    llm: >-
      Fires when element crosses viewport threshold via IntersectionObserver.
    human: >-
      Triggers an animation when an element scrolls into the visible area
      of the page.
    params:
      - name: threshold
        type: number
        default: 0.2
        description: "Fraction of element that must be visible (0–1)"
      - name: inset
        type: string
        default: "undefined"
        description: "Mapped to IntersectionObserver rootMargin"
      - name: effectId
        type: string
        default: null
        required: true
        description: "ID of the preceding effect to chain after"
    caveats:
      - >-
        When source and target are the same element, only triggerType 'once'
        is reliable.
    sourceFile: src/types/triggers.ts
    sourceName: ViewEnterParams
    related:
      - trigger-hover
      - config-InteractConfig

  - id: trigger-hover
    name: hover
    category: trigger
    llm: >-
      Fires on mouseenter/mouseleave events.
    human: >-
      Triggers animations when the user hovers over an element.
    params:
      - name: delay
        type: number
        default: 0
        description: "Delay before triggering in ms"

  - id: config-InteractConfig
    name: InteractConfig
    category: config
    llm: >-
      Top-level configuration object passed to Interact.create().
    human: >-
      The root configuration object that defines all interactions.
    fields:
      - name: effects
        type: "Record<string, Effect>"
        required: true
        description: "Reusable effect definitions keyed by effectId"
      - name: interactions
        type: "Interaction[]"
        required: true
        description: "Array of trigger-to-effect bindings"
      - name: sequences
        type: "Record<string, SequenceConfig>"
        required: false
        description: "Reusable sequence definitions"

  - id: enum-TriggerType
    name: TriggerType
    category: enum
    llm: >-
      Controls repeat behavior for time-based effects.
    human: >-
      Determines how an effect responds when its trigger fires multiple times.
    values:
      - value: "once"
        description: "Fires once then stops."
      - value: "repeat"
        description: "Fires every time the trigger activates."
      - value: "alternate"
        description: "Alternates forward/reverse."
      - value: "state"
        description: "Applies CSS state via stateAction."

  - id: api-create
    name: Interact.create
    category: api
    llm: >-
      Creates a new Interact instance from config.
    human: >-
      Initializes the interaction system with a configuration object.
    signature: "static create(config: InteractConfig): Interact"
    returns: "Interact instance"
    code: |
      const instance = Interact.create(config);
    related:
      - config-InteractConfig

  - id: concept-fouc
    name: FOUC Prevention
    category: concept
    llm: >-
      Requires BOTH generate(config) and data-interact-initial="true" on elements.
    human: >-
      Flash of Un-animated Content occurs when entrance-animated elements
      briefly show their final state before the animation runs.
    caveats:
      - "Only valid for viewEnter + triggerType 'once'."
      - "generate() should run server-side or at build time."
    code: |
      const css = generate(config);
