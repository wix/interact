<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@wix/interact - Examples</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@100;200;300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/variables.css" />
    <link rel="stylesheet" href="assets/css/theme.css" />
    <link rel="stylesheet" href="assets/css/reset.css" />
    <link rel="stylesheet" href="assets/css/nav.css" />
    <link rel="stylesheet" href="assets/css/footer.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/theme/material-darker.min.css"
    />
    <link rel="stylesheet" href="assets/css/examples.css" />
    <style>
      /* Critical CSS for viewEnter entrance animations - prevents FOUC */
      @media (prefers-reduced-motion: no-preference) {
        [data-interact-initial='true'] > :first-child:not([data-interact-enter]) {
          visibility: hidden;
          transform: none;
          translate: none;
          scale: none;
          rotate: none;
        }
      }
    </style>
  </head>
  <body>
    <nav class="site-nav">
      <a href="/" class="nav-logo">● Interact</a>
      <div class="nav-actions">
        <div class="nav-links">
          <a href="#" class="nav-link">Docs</a>
          <a href="/examples.html" class="nav-link is-active">Examples</a>
        </div>
        <a href="https://github.com/wix-incubator/interact" target="_blank" rel="noopener noreferrer" class="nav-cta">Go to Repository ↗</a>
      </div>
    </nav>

    <!-- Main Layout -->
    <div class="main-layout">
      <!-- Sidebar -->
      <interact-element data-interact-key="page-sidebar" data-interact-initial="true">
        <div class="sidebar-wrapper">
          <div class="sidebar">
            <div class="sidebar-arrow">→</div>
            <div class="category-list-wrapper">
              <div class="category-list" id="categoryList"></div>
            </div>
          </div>
        </div>
      </interact-element>

      <!-- Connector -->
      <interact-element data-interact-key="page-connector" data-interact-initial="true">
        <div class="connector"></div>
      </interact-element>

      <!-- Main Content -->
      <interact-element data-interact-key="page-content" data-interact-initial="true">
        <div class="content-container">
          <div class="content-scroll" id="contentScroll"></div>
        </div>
      </interact-element>
    </div>

    <footer class="site-footer">
      <div class="footer-brand">
        <h2>● Interact</h2>
        <p>© 2026</p>
      </div>
      <div class="footer-links">
        <a href="https://www.npmjs.com/package/@wix/interact" target="_blank" rel="noopener noreferrer" class="footer-link">NPM</a>
        <a href="https://github.com/wix-incubator/interact" target="_blank" rel="noopener noreferrer" class="footer-link">Github</a>
      </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/search/searchcursor.min.js"></script>

    <!-- Interact entrance animation -->
    <script type="module">
      import { Interact } from '/assets/lib/interact/es/web.js';
      import * as presets from '/assets/lib/motion-presets/motion-presets.js';

      Interact.registerEffects(presets);

      Interact.create({
        interactions: [
          {
            key: 'page-sidebar',
            trigger: 'viewEnter',
            effects: [{ effectId: 'float-left' }],
          },
          {
            key: 'page-connector',
            trigger: 'viewEnter',
            effects: [{ effectId: 'fade-in' }],
          },
          {
            key: 'page-content',
            trigger: 'viewEnter',
            effects: [{ effectId: 'float-bottom' }],
          },
        ],
        effects: {
          'float-left': {
            duration: 700,
            delay: 150,
            easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
            fill: 'both',
            namedEffect: { type: 'FloatIn', direction: 'left' },
          },
          'fade-in': {
            duration: 500,
            delay: 200,
            easing: 'ease',
            fill: 'both',
            namedEffect: { type: 'FadeIn' },
          },
          'float-bottom': {
            duration: 700,
            delay: 200,
            easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
            fill: 'both',
            namedEffect: { type: 'FloatIn', direction: 'bottom' },
          },
        },
      });
    </script>

    <script type="importmap">
      {
        "imports": {
          "@wix/motion": "./assets/lib/motion/motion.js"
        }
      }
    </script>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
