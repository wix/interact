<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Click</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      interact-element {
        display: block;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1f1f1f;
        overflow: hidden;
      }
      .scene {
        width: 100%;
        height: 100vh;
        position: relative;
        overflow: hidden;
      }
      .circle {
        width: 16rem;
        height: 16rem;
        background-color: transparent;
        border: 1px solid white;
        border-radius: 50%;
        position: relative;
        overflow: hidden;
        will-change: transform;
      }
      .fill-circle {
        width: 100%;
        height: 100%;
        background-color: white;
        border-radius: 50%;
        transform: scale(0);
        will-change: transform;
      }
      .ripple-init {
        opacity: 0;
        transform: scale(0.8);
      }
      [data-interact-key='click-ripple-2'] {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
        pointer-events: none;
      }
      [data-interact-key='click-ripple-1'] {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 20;
        pointer-events: none;
      }
      [data-interact-key='click-center'] {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 30;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <interact-element data-interact-key="click-ripple-2">
        <div class="circle ripple-init"></div>
      </interact-element>
      <interact-element data-interact-key="click-ripple-1">
        <div class="circle ripple-init"></div>
      </interact-element>
      <interact-element data-interact-key="click-center">
        <div class="circle"><div class="fill-circle"></div></div>
      </interact-element>
    </div>

    <script type="module">
      import { Interact } from '/assets/lib/interact/es/web.js';

      Interact.create({
        interactions: [
          {
            key: 'click-center',
            trigger: 'click',
            effects: [
              {
                selector: '.fill-circle',
                transition: {
                  duration: 500,
                  easing: 'ease-out',
                  styleProperties: [{ name: 'transform', value: 'scale(1)' }],
                },
              },
              {
                key: 'click-ripple-1',
                transition: {
                  duration: 800,
                  easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
                  styleProperties: [
                    { name: 'opacity', value: '1' },
                    { name: 'transform', value: 'scale(1.7)' },
                  ],
                },
              },
              {
                key: 'click-ripple-2',
                transition: {
                  duration: 800,
                  easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
                  delay: 50,
                  styleProperties: [
                    { name: 'opacity', value: '0.5' },
                    { name: 'transform', value: 'scale(2.6)' },
                  ],
                },
              },
            ],
          },
        ],
      });
    </script>
  </body>
</html>
