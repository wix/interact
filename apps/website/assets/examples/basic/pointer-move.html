<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="importmap">
      {
        "imports": {
          "@wix/motion": "/assets/lib/motion/motion.js"
        }
      }
    </script>

    <title>Pointer Movement</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      interact-element {
        display: block;
      }
      body {
        width: 100vw;
        height: 100vh;
        background: #1f1f1f;
        overflow: hidden;
      }
      body > div {
        width: 100%;
        height: 100%;
        perspective: 1200px;
      }
      [data-interact-key='mt-scene-root'],
      [data-interact-key='mt-card-target'] {
        width: 100%;
        height: 100%;
        display: block;
      }
      [data-interact-key='mt-card-target'] > div {
        width: 100%;
        height: 100%;
        background: #1f1f1f;
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-style: preserve-3d;
      }
      [data-interact-key='mt-content-target'] {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .preserve-3d {
        transform-style: preserve-3d;
      }
      .ring-base {
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.8);
        position: absolute;
      }
      .tunnel-static {
        width: 14rem;
        height: 14rem;
        border-width: 2px;
        border-color: rgba(255, 255, 255, 0.4);
        z-index: 10;
      }
      .tunnel-mover-root {
        border: none;
        width: 100%;
        height: 100%;
      }
      .tunnel-moving {
        width: 85%;
        height: 85%;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      /* Force the tunnel mount to be square so the nested 85% circles stay circular
       even when the iframe viewport isn't 1:1 (now 16:10). */
      #tunnel-mount {
        width: 100vmin !important;
        height: 100vmin !important;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-style: preserve-3d;
      }
    </style>
  </head>
  <body>
    <div>
      <interact-element data-interact-key="mt-scene-root">
        <interact-element data-interact-key="mt-card-target">
          <div>
            <interact-element data-interact-key="mt-content-target">
              <div id="tunnel-mount">
                <div class="ring-base tunnel-static"></div>
                <div class="ring-base tunnel-mover-root">
                  <div class="ring-base tunnel-moving">
                    <div class="ring-base tunnel-moving">
                      <div class="ring-base tunnel-moving">
                        <div class="ring-base tunnel-moving">
                          <div class="ring-base tunnel-moving">
                            <div class="ring-base tunnel-moving">
                              <div class="ring-base tunnel-moving">
                                <div class="ring-base tunnel-moving">
                                  <div class="ring-base tunnel-moving">
                                    <div class="ring-base tunnel-moving">
                                      <div class="ring-base tunnel-moving"></div>
                                    </div>
                                  </div>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </interact-element>
          </div>
        </interact-element>
      </interact-element>
    </div>

    <script type="module">
      import { Interact } from '/assets/lib/interact/es/web.js';
      import * as presets from '/assets/lib/motion-presets/motion-presets.js';
      Interact.registerEffects(presets);

      Interact.create({
        interactions: [
          {
            key: 'mt-scene-root',
            trigger: 'pointerMove',
            params: { hitArea: 'self' },
            effects: [
              {
                key: 'mt-card-target',
                namedEffect: { type: 'Tilt3DMouse', maxAngle: 25, perspective: 200 },
                fill: 'both',
                composite: 'replace',
              },
              {
                key: 'mt-content-target',
                namedEffect: { type: 'Tilt3DMouse', maxAngle: 60, perspective: 100 },
                fill: 'both',
                composite: 'replace',
              },
            ],
          },
        ],
      });
    </script>
  </body>
</html>
