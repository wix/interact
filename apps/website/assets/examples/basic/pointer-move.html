<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="importmap">
    {
      "imports": {
        "@wix/motion": "/assets/lib/motion/motion.js"
      }
    </script>

    <title>Pointer Movement</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      interact-element {
        display: block;
      }
      body {
        width: 100vw;
        height: 100vh;
        background: #1f1f1f;
        overflow: hidden;
      }
      .preserve-3d {
        transform-style: preserve-3d;
      }
      .ring-base {
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.8);
        position: absolute;
      }
      .tunnel-static {
        width: 14rem;
        height: 14rem;
        border-width: 2px;
        border-color: rgba(255, 255, 255, 0.4);
        z-index: 10;
      }
      .tunnel-moving {
        width: 85%;
        height: 85%;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      /* Force the tunnel mount to be square so the nested 85% circles stay circular
       even when the iframe viewport isn't 1:1 (now 16:10). */
      #tunnel-mount {
        width: 100vmin !important;
        height: 100vmin !important;
      }
    </style>
  </head>
  <body>
    <div style="width: 100%; height: 100%; perspective: 1200px">
      <interact-element
        data-interact-key="mt-scene-root"
        style="width: 100%; height: 100%; display: block"
      >
        <interact-element
          data-interact-key="mt-card-target"
          style="width: 100%; height: 100%; display: block"
        >
          <div
            style="
              width: 100%;
              height: 100%;
              background: #1f1f1f;
              overflow: hidden;
              position: relative;
              display: flex;
              align-items: center;
              justify-content: center;
              transform-style: preserve-3d;
            "
          >
            <interact-element
              data-interact-key="mt-content-target"
              style="
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <div
                id="tunnel-mount"
                style="
                  width: 100%;
                  height: 100%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  transform-style: preserve-3d;
                "
              ></div>
            </interact-element>
          </div>
        </interact-element>
      </interact-element>
    </div>

    <script type="module">
      import { Interact } from '/assets/lib/interact/es/web.js';
      import * as presets from '/assets/lib/motion-presets/motion-presets.js';
      Interact.registerEffects(presets);

      // Build tunnel — 12 depth levels, matching homepage exactly
      const mount = document.getElementById('tunnel-mount');
      const DEPTH = 12;
      let currentParent = mount;

      for (let i = 0; i < DEPTH; i++) {
        const circle = document.createElement('div');

        if (i === 0) {
          circle.classList.add('ring-base', 'tunnel-static');
          mount.appendChild(circle);

          const moverRoot = document.createElement('div');
          moverRoot.classList.add('ring-base');
          moverRoot.style.border = 'none';
          moverRoot.style.width = '100%';
          moverRoot.style.height = '100%';
          mount.appendChild(moverRoot);
          currentParent = moverRoot;
        } else {
          circle.classList.add('tunnel-moving', 'ring-base');
          circle.style.position = 'relative';
          currentParent.appendChild(circle);
          currentParent = circle;
        }
      }

      Interact.create({
        interactions: [
          {
            key: 'mt-scene-root',
            trigger: 'pointerMove',
            params: { hitArea: 'self' },
            effects: [
              {
                key: 'mt-card-target',
                namedEffect: { type: 'Tilt3DMouse', maxAngle: 25, perspective: 200 },
                fill: 'both',
                composite: 'replace',
              },
              {
                key: 'mt-content-target',
                namedEffect: { type: 'Tilt3DMouse', maxAngle: 60, perspective: 100 },
                fill: 'both',
                composite: 'replace',
              },
            ],
          },
        ],
      });
    </script>
  </body>
</html>
