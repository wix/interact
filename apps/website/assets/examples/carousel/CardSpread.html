<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Spread Animation</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #dddddd;
        --text-color: #111;
        --card-title-color: #ffffff;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
      }

      interact-element {
        display: block;
      }

      /* --- Default Styles (Assume Desktop) --- */
      .scroll-section {
        height: 400vh; /* Desktop scroll height */
      }

      .cards-container-wrapper {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: hidden;
      }

      #cards-collection {
        position: relative;
        width: 20vw;
        height: 100vh;
        margin: 0 auto;
      }

      .card {
        position: absolute;
        width: 20vw;
        height: 100vh;
        border-radius: 16px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 5rem;
        font-weight: bold;
        overflow: hidden;
        color: rgba(255, 255, 255, 0.8);
        will-change: transform, height, opacity; /* Performance hint */
        transform: translateX(0); /* Default desktop state */
      }

      .card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
      }

      .card-content {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 2rem;
        z-index: 2;
        text-align: center;
        color: var(--card-title-color);
        background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
      }

      .card-content h2 {
        font-size: 2rem;
        font-weight: 700;
        margin: 0 0 0.5rem 0;
      }

      .card-content p {
        font-size: 1rem;
        font-weight: 400;
        margin: 0;
      }
      /* Z-index for desktop stacking */
      #card-1 {
        z-index: 3;
      }
      #card-2 {
        z-index: 4;
      }
      #card-3 {
        z-index: 5;
      }
      #card-4 {
        z-index: 2;
      }
      #card-5 {
        z-index: 1;
      }

      /* --- Mobile Styles --- */
      @media (max-width: 768px) {
        .scroll-section {
          /*
                  FIX: Changed height to 500vh.
                  This provides 400vh of total scroll distance (500vh - 100vh viewport).
                  This 400vh maps to the 0-100% 'cover' range,
                  allowing each of the 4 card transitions (25% each)
                  to map perfectly to 100vh of scrolling.
                */
          height: 500vh;
        }

        #cards-collection {
          width: 90vw;
        }

        .card {
          width: 100%; /* Full width of the collection */
          height: 75vh;
          left: 0;
          top: 12.5vh; /* Center vertically with margin */
          /* Card 1 starts in view */
          transform: translateY(0);
          will-change: transform; /* Add will-change for mobile */
        }
        /* Initially hide cards 2-5 below the viewport via CSS */
        /* This MUST be set correctly for fill: 'both' to work */
        #card-2,
        #card-3,
        #card-4,
        #card-5 {
          transform: translateY(100vh);
        }

        .card-content {
          text-align: left;
          padding: 1.5rem;
        }
        .card-content h2 {
          font-size: 1.5rem;
        }
        .card-content p {
          font-size: 0.9rem;
        }

        /* Z-index for mobile stacking order: Card 1 is at the bottom, Card 5 is at the top. */
        #card-1 {
          z-index: 1;
        }
        #card-2 {
          z-index: 2;
        }
        #card-3 {
          z-index: 3;
        }
        #card-4 {
          z-index: 4;
        }
        #card-5 {
          z-index: 5;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card {
          transform: none !important;
          height: 100vh !important;
          opacity: 1 !important;
        }
        /* Make sure desktop cards are visible */
        @media (min-width: 769px) {
          .card {
            height: 85vh !important;
          } /* Match end state height */
          #card-1 {
            transform: translateX(-40vw) !important;
          }
          #card-2 {
            transform: translateX(-20vw) !important;
          }
          #card-3 {
            transform: translateX(0) !important;
          }
          #card-4 {
            transform: translateX(20vw) !important;
          }
          #card-5 {
            transform: translateX(40vw) !important;
          }
        }
        /* Ensure all mobile cards are visible */
        @media (max-width: 768px) {
          #card-1,
          #card-2,
          #card-3,
          #card-4,
          #card-5 {
            transform: translateY(0) !important;
          }
        }
      }
    </style>
  </head>
  <body>
    <interact-element data-interact-key="scroll-section">
      <section class="scroll-section">
        <div class="cards-container-wrapper">
          <interact-element data-interact-key="cards-collection">
            <div id="cards-collection">
              <interact-element data-interact-key="card-1">
                <div id="card-1" class="card">
                  <img
                    src="/assets/img/snail-shell.jpg"
                    alt="Misty mountains"
                  />
                  <div class="card-content">
                    <h2>Serene Peaks</h2>
                    <p>Find your calm</p>
                  </div>
                </div>
              </interact-element>
              <interact-element data-interact-key="card-2">
                <div id="card-2" class="card">
                  <img
                    src="/assets/img/water-ripples.jpg"
                    alt="Green hills"
                  />
                  <div class="card-content">
                    <h2>Rolling Hills</h2>
                    <p>Explore the landscape</p>
                  </div>
                </div>
              </interact-element>
              <interact-element data-interact-key="card-3">
                <div id="card-3" class="card">
                  <img
                    src="/assets/img/leaf-veins.jpg"
                    alt="Mountain lake"
                  />
                  <div class="card-content">
                    <h2>Alpine Lake</h2>
                    <p>Reflect and relax</p>
                  </div>
                </div>
              </interact-element>
              <interact-element data-interact-key="card-4">
                <div id="card-4" class="card">
                  <img
                    src="/assets/img/cracked-rock-face.jpg"
                    alt="Waterfall"
                  />
                  <div class="card-content">
                    <h2>Hidden Falls</h2>
                    <p>Discover nature's power</p>
                  </div>
                </div>
              </interact-element>
              <interact-element data-interact-key="card-5">
                <div id="card-5" class="card">
                  <img
                    src="/assets/img/stone-rosette.jpg"
                    alt="Forest from above"
                  />
                  <div class="card-content">
                    <h2>Forest Canopy</h2>
                    <p>Breathe the fresh air</p>
                  </div>
                </div>
              </interact-element>
            </div>
          </interact-element>
        </div>
      </section>
    </interact-element>

    <script type="module">
      import { Interact } from '/assets/lib/interact/es/web.js';

      /** Matches `@media (max-width: 768px)` / `(min-width: 769px)` in the stylesheet above. */
      const config = {
        conditions: {
          mobile: {
            type: 'media',
            predicate: '(max-width: 768px)',
          },
          desktop: {
            type: 'media',
            predicate: '(min-width: 769px)',
          },
        },
        interactions: [
          {
            key: 'scroll-section',
            trigger: 'viewProgress',
            effects: [
              {
                key: 'cards-collection',
                selector: '.card',
                conditions: ['desktop'],
                keyframeEffect: {
                  name: 'card-shrink',
                  keyframes: [{ height: '100vh' }, { height: '85vh' }],
                },
                rangeStart: { name: 'cover', offset: { unit: 'percentage', value: 20 } },
                rangeEnd: { name: 'cover', offset: { unit: 'percentage', value: 80 } },
                easing: 'cubic-bezier(0.42, 0, 0.58, 1)',
                fill: 'both',
              },
              {
                key: 'card-1',
                conditions: ['desktop'],
                keyframeEffect: {
                  name: 'card-1-move',
                  keyframes: [{ transform: 'translateX(0)' }, { transform: 'translateX(-40vw)' }],
                },
                rangeStart: { name: 'cover', offset: { unit: 'percentage', value: 20 } },
                rangeEnd: { name: 'cover', offset: { unit: 'percentage', value: 80 } },
                easing: 'cubic-bezier(0.42, 0, 0.58, 1)',
                fill: 'both',
              },
              {
                key: 'card-2',
                conditions: ['desktop'],
                keyframeEffect: {
                  name: 'card-2-move',
                  keyframes: [{ transform: 'translateX(0)' }, { transform: 'translateX(-20vw)' }],
                },
                rangeStart: { name: 'cover', offset: { unit: 'percentage', value: 20 } },
                rangeEnd: { name: 'cover', offset: { unit: 'percentage', value: 80 } },
                easing: 'cubic-bezier(0.42, 0, 0.58, 1)',
                fill: 'both',
              },
              {
                key: 'card-3',
                conditions: ['desktop'],
                keyframeEffect: {
                  name: 'card-3-move',
                  keyframes: [{ transform: 'translateX(0)' }, { transform: 'translateX(0)' }],
                },
                rangeStart: { name: 'cover', offset: { unit: 'percentage', value: 20 } },
                rangeEnd: { name: 'cover', offset: { unit: 'percentage', value: 80 } },
                easing: 'cubic-bezier(0.42, 0, 0.58, 1)',
                fill: 'both',
              },
              {
                key: 'card-4',
                conditions: ['desktop'],
                keyframeEffect: {
                  name: 'card-4-move',
                  keyframes: [{ transform: 'translateX(0)' }, { transform: 'translateX(20vw)' }],
                },
                rangeStart: { name: 'cover', offset: { unit: 'percentage', value: 20 } },
                rangeEnd: { name: 'cover', offset: { unit: 'percentage', value: 80 } },
                easing: 'cubic-bezier(0.42, 0, 0.58, 1)',
                fill: 'both',
              },
              {
                key: 'card-5',
                conditions: ['desktop'],
                keyframeEffect: {
                  name: 'card-5-move',
                  keyframes: [{ transform: 'translateX(0)' }, { transform: 'translateX(40vw)' }],
                },
                rangeStart: { name: 'cover', offset: { unit: 'percentage', value: 20 } },
                rangeEnd: { name: 'cover', offset: { unit: 'percentage', value: 80 } },
                easing: 'cubic-bezier(0.42, 0, 0.58, 1)',
                fill: 'both',
              },
              {
                key: 'card-2',
                conditions: ['mobile'],
                keyframeEffect: {
                  name: 'card-2-in',
                  keyframes: [{ transform: 'translateY(100vh)' }, { transform: 'translateY(0)' }],
                },
                rangeStart: { name: 'contain', offset: { unit: 'percentage', value: 0 } },
                rangeEnd: { name: 'contain', offset: { unit: 'percentage', value: 25 } },
                easing: 'linear',
                fill: 'both',
              },
              {
                key: 'card-3',
                conditions: ['mobile'],
                keyframeEffect: {
                  name: 'card-3-in',
                  keyframes: [{ transform: 'translateY(100vh)' }, { transform: 'translateY(0)' }],
                },
                rangeStart: { name: 'contain', offset: { unit: 'percentage', value: 25 } },
                rangeEnd: { name: 'contain', offset: { unit: 'percentage', value: 50 } },
                easing: 'linear',
                fill: 'both',
              },
              {
                key: 'card-4',
                conditions: ['mobile'],
                keyframeEffect: {
                  name: 'card-4-in',
                  keyframes: [{ transform: 'translateY(100vh)' }, { transform: 'translateY(0)' }],
                },
                rangeStart: { name: 'contain', offset: { unit: 'percentage', value: 50 } },
                rangeEnd: { name: 'contain', offset: { unit: 'percentage', value: 75 } },
                easing: 'linear',
                fill: 'both',
              },
              {
                key: 'card-5',
                conditions: ['mobile'],
                keyframeEffect: {
                  name: 'card-5-in',
                  keyframes: [{ transform: 'translateY(100vh)' }, { transform: 'translateY(0)' }],
                },
                rangeStart: { name: 'contain', offset: { unit: 'percentage', value: 75 } },
                rangeEnd: { name: 'contain', offset: { unit: 'percentage', value: 100 } },
                easing: 'linear',
                fill: 'both',
              },
            ],
          },
        ],
      };

      Interact.create(config);
    </script>
  </body>
</html>
