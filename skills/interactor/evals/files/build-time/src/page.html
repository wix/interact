<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trailhead</title>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        color: #14181f;
      }
      .hero {
        min-height: 90vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 2rem;
        background: #eef2f7;
      }
      .hero h1 {
        font-size: clamp(2.5rem, 6vw, 4rem);
      }
      .hero p {
        margin-top: 1rem;
        font-size: 1.25rem;
        color: #46505f;
      }
      section {
        padding: 6rem 1.5rem;
        max-width: 60rem;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div>
        <h1>Find your next trail</h1>
        <p>Routes, conditions, and gear lists — updated by locals.</p>
      </div>
    </section>

    <section>
      <h2>Why Trailhead</h2>
      <p>Curated routes with real trip reports, not marketing copy.</p>
    </section>
  </body>
</html>
